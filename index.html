<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consiglialibro 📖 — Il tuo prossimo libro ti aspetta</title>
  <meta name="description" content="Consiglialibro: rispondi a sei domande e trova il libro giusto per te, scelto e approvato dal prof Campedelli.">

  <!-- Icone del sito (il marchio: libro aperto con la spunta del prof) -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#efe8d4">

  <!-- ============================================================
       ANTEPRIMA QUANDO CONDIVIDI IL LINK
       (WhatsApp, Classroom, Telegram, Facebook…)
       Gli indirizzi qui sotto sono COMPLETI, non abbreviati: alcune
       app (Facebook e LinkedIn in testa) non sanno ricostruire un
       indirizzo parziale e mostrerebbero l'anteprima senza figura.
       ⚠️ Se un giorno il sito cambiasse indirizzo, vanno corretti
       i punti che iniziano con https://profcampedelli.netsons.org
       ============================================================ -->
  <link rel="canonical" href="https://profcampedelli.netsons.org/consiglialibro/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:site_name" content="Consiglialibro">
  <meta property="og:url" content="https://profcampedelli.netsons.org/consiglialibro/">
  <meta property="og:title" content="Consiglialibro 📖 — Il tuo prossimo libro ti aspetta">
  <meta property="og:description" content="Rispondi a sei domande e trova il libro giusto per te. Tutti i libri sono stati letti, classificati e approvati dal prof Campedelli.">
  <meta property="og:image" content="https://profcampedelli.netsons.org/consiglialibro/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Il logo di Consiglialibro: un libro aperto con la spunta rossa del prof, su un foglio di quaderno a righe.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Consiglialibro 📖 — Il tuo prossimo libro ti aspetta">
  <meta name="twitter:description" content="Rispondi a sei domande e trova il libro giusto per te. Libri letti e approvati dal prof Campedelli.">
  <meta name="twitter:image" content="https://profcampedelli.netsons.org/consiglialibro/og-image.png">

  <!-- Google Fonts: Caveat (titoli a mano) + Kalam (scrittura a mano leggibile) + Roboto (corpo lungo leggibile) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== BARRA SUPERIORE ===================== -->
  <header class="header">
    <div class="header-inner">
      <div class="header-testi">
        <p class="logo">
          <!-- Il marchio. Il libro usa currentColor, così eredita
               --inchiostro da .logo: cambi il colore del titolo e il
               logo lo segue. La dimensione si regola in style.css,
               classe .logo-marchio. -->
          <svg class="logo-marchio" viewBox="0 0 32 32" fill="none"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.1 12C8.2 11 12.6 12.6 15.9 14.5C15.9 18.6 16.1 22.2 15.9 25.8C12.3 24 7.8 22.7 3.8 23.5C4.2 19.7 3.8 15.9 4.1 12Z"
                  fill="#fff3b0" stroke="currentColor" stroke-width="2.1"/>
            <path d="M15.9 14.5C19.5 12.4 24.2 10.8 28.3 11.7C28.1 15.6 28.5 19.4 28.2 23.3C24.2 22.4 19.5 24 15.9 25.8"
                  stroke="currentColor" stroke-width="2.1"/>
            <path d="M8.6 17.2C10.3 19.3 12.1 21.8 13.5 24.1C17.9 16.6 23.2 9.2 28.6 2.9"
                  stroke="#efe8d4" stroke-width="4.6"/>
            <path d="M8.6 17.2C10.3 19.3 12.1 21.8 13.5 24.1C17.9 16.6 23.2 9.2 28.6 2.9"
                  stroke="#c2453b" stroke-width="2.5"/>
          </svg>Consiglialibro</p>
        <!-- I testi qui sotto vengono riempiti da app.js: modificali lì, in cima al file -->
        <p class="sottotitolo" id="sottotitolo"></p>
        <p class="nota-catalogo" id="nota-catalogo">
          <span class="pallino" aria-hidden="true"></span>
          <span id="nota-testo"></span>
          <span class="conta-libri" id="conta-libri"></span>
        </p>
      </div>
      <div class="header-azioni">
        <button type="button" id="btn-catalogo" class="btn-info" aria-haspopup="dialog">
          <span aria-hidden="true">📚</span> Catalogo
        </button>
        <button type="button" id="btn-info" class="btn-info" aria-haspopup="dialog">
          <span aria-hidden="true">ℹ️</span> Info
        </button>
      </div>
    </div>
  </header>

  <!-- ===================== AREA CHAT ===================== -->
  <main class="main">
    <h1 class="visually-hidden">Consiglialibro: trova il libro giusto per te</h1>
    <section id="chat" class="chat" aria-label="Conversazione con Consiglialibro"></section>
    <!-- Zona invisibile che legge i messaggi, una volta sola e già
         completi, a chi usa uno screen reader. Non toglierla: senza,
         l'effetto macchina da scrivere farebbe rileggere ogni frase
         da capo a ogni carattere. -->
    <div id="annunci" class="visually-hidden" role="status" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <p>© profcampedelli - Vuoi suggerirmi un libro da aggiungere al catalogo? · <button type="button" class="link-info" id="btn-info-footer">ℹ️ Info e contatti</button></p>
  </footer>

  <!-- ===================== MODALE INFO ===================== -->
  <div class="modale" id="modale-info" role="dialog" aria-modal="true" aria-labelledby="titolo-info" hidden>
    <div class="modale-contenuto">
      <button type="button" class="modale-chiudi" aria-label="Chiudi la finestra">✕</button>
      <h2 id="titolo-info" class="modale-titolo">📖 Cos'è Consiglialibro?</h2>
      <div id="info-descrizione" class="info-blocco"></div>
      <h3 class="info-sezione">👨‍🏫 Chi sono</h3>
      <div id="info-bio" class="info-blocco"></div>
      <h3 class="info-sezione">✉️ Contatti</h3>
      <ul class="contatti" id="contatti"></ul>
      <h3 class="info-sezione">☕ Sostieni</h3>
      <p class="info-blocco info-sostieni">Se vuoi sostenere i miei progetti:</p>
      <div class="bmc-contenitore">
        <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="ivancampedelli" data-color="#ffe680" data-emoji="☕"  data-font="Cookie" data-text="Offrimi un caffè" data-outline-color="#2b3a55" data-font-color="#2b3a55" data-coffee-color="#ffffff" ></script>
      </div>
    </div>
  </div>

  <!-- ===================== MODALE CATALOGO ===================== -->
  <div class="modale" id="modale-catalogo" role="dialog" aria-modal="true" aria-labelledby="titolo-catalogo" hidden>
    <div class="modale-contenuto modale-contenuto-catalogo">
      <button type="button" class="modale-chiudi" aria-label="Chiudi il catalogo">✕</button>
      <h2 id="titolo-catalogo" class="modale-titolo">📚 Tutto il catalogo</h2>
      <div id="catalogo-contenitore"></div>
    </div>
  </div>

  <!-- ===================== MODALE SCHEDA LIBRO (per il catalogo) ===================== -->
  <div class="modale" id="modale-scheda" role="dialog" aria-modal="true" aria-label="Scheda del libro" hidden>
    <div class="modale-contenuto modale-contenuto-scheda">
      <button type="button" class="modale-chiudi" aria-label="Chiudi la scheda">✕</button>
      <div id="scheda-contenitore"></div>
    </div>
  </div>

  <script src="catalogo.js"></script>
  <script src="app.js"></script>
</body>
</html>
