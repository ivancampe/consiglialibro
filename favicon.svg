<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"
     stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Consiglialibro">
  <title>Consiglialibro</title>

  <!-- Fondo carta: serve perché l'icona resti visibile anche sulle
       schede scure del browser (senza, il tratto blu sparirebbe). -->
  <rect width="32" height="32" rx="7" fill="#f7f3e7"/>

  <!-- Pagina sinistra: unico tocco di giallo post-it -->
  <path d="M4.1 12C8.2 11 12.6 12.6 15.9 14.5C15.9 18.6 16.1 22.2 15.9 25.8C12.3 24 7.8 22.7 3.8 23.5C4.2 19.7 3.8 15.9 4.1 12Z"
        fill="#fff3b0" stroke="#2b3a55" stroke-width="2.1"/>

  <!-- Pagina destra, leggermente più alta: asimmetria voluta -->
  <path d="M15.9 14.5C19.5 12.4 24.2 10.8 28.3 11.7C28.1 15.6 28.5 19.4 28.2 23.3C24.2 22.4 19.5 24 15.9 25.8"
        stroke="#2b3a55" stroke-width="2.1"/>

  <!-- Spunta: sotto corre un'aureola color carta, così alle
       dimensioni piccole il rosso non si impasta col blu. -->
  <path d="M8.6 17.2C10.3 19.3 12.1 21.8 13.5 24.1C17.9 16.6 23.2 9.2 28.6 2.9"
        stroke="#f7f3e7" stroke-width="4.6"/>
  <path d="M8.6 17.2C10.3 19.3 12.1 21.8 13.5 24.1C17.9 16.6 23.2 9.2 28.6 2.9"
        stroke="#c2453b" stroke-width="2.5"/>
</svg>
